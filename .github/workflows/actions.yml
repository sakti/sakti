name: Execute
on:
  # Schedule updates (daily)
  # schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: { branches: ["master", "main"] }
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # credentials must persist: git-auto-commit-action uses them to push
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 # zizmor: ignore[artipacked]
      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
      - name: Run
        run: uv run src/sakti/generate.py
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: Update README
          file_pattern: README.md
